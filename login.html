<!DOCTYPE html>
<html>
    <head>
        <title>KAIZER'S WEBSITE</title>
        <link rel="stylesheet" href="login_style.css">
    </head>
    <body>
        <div class="container">
        <center>
        <img id="icon" src="images/icon/179a91f1-cc2f-4caf-bc01-b04b3237b408-removebg-preview.png" width="50px" height="50px">
        <h5>WELCOME TO MY WEBSITE</h5>
        <label for="uname">USERNAME</label>
        <input type="text" id="uname" placeholder="Username" required>
        <label for="pword">PASSWORD</label>
        <input type="password" id="pword"placeholder="Password" required>
        <input type="checkbox" id="show-pword">Show Password
        <button id="submit">LOG IN</button>
        <div class="alternative_login">
        <hr>
        <h6>OR</h6>
        <hr>
        </div>
        <div class="social-btn">
        
        <a href="https://accounts.google.com.ph/"><button id="Google"><img class="google_icon" src="images/icon/c6cf6371-da25-4b02-bf72-d9ea2fd5ab00-removebg-preview.png" alt="" width="15px" height="15px">Continue with Google</button></a>
        
        <button id="Facebook"> <img class="facebook_icon" src="images/icon/Facebook_logo_vector_free_download_-_Seelogo_net-removebg-preview.png" alt="" width="13px" height="13px">Continue with Facebook</button>
        </div>
        </center>
        </div>
        <script src="login.js"></script>
    </body>
</html>
